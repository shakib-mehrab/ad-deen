<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ad-Deen master logo (single source of truth).
  Canvas is the Android adaptive-icon grid: 108 x 108 units.
  Everything inside <g id="foreground"> stays within the 66-unit safe zone (circle r=33 around 54,54).

  Rules so scripts/icons/generate-icons.mjs can convert it to Android vector drawables:
    - Only <path> elements with absolute "d", a hex "fill" and optional fill-rule="evenodd".
    - Keep the two layer groups: id="background" and id="foreground".
  Colors: background #874D14 (brand brown), crescent #FFB030 (brand gold), mosque #FFF4D6 (cream).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 108 108">
  <g id="background">
    <path d="M0,0 H108 V108 H0 Z" fill="#874D14"/>
  </g>
  <g id="foreground">
    <!-- Crescent: outer circle (52,54 r27) minus inner circle (59,51 r23) -->
    <path d="M59.29,28 A27,27 0 1,0 75.85,66.65 A23,23 0 1,1 59.29,28 Z" fill="#FFB030"/>
    <!-- Mosque: onion dome + body, arched door cut out (even-odd) -->
    <path fill-rule="evenodd" fill="#FFF4D6"
          d="M47,67 L47,58 L50.5,58 C47.5,55 47.5,49.5 51,46 C54,43 58,40.5 59,36 C60,40.5 64,43 67,46 C70.5,49.5 70.5,55 67.5,58 L71,58 L71,67 Z M55.8,67 L55.8,62.2 C55.8,60.4 57.2,59 59,59 C60.8,59 62.2,60.4 62.2,62.2 L62.2,67 Z"/>
    <!-- Finial -->
    <path d="M59,31.4 C59.9,31.4 60.6,32.1 60.6,33 C60.6,33.9 59.9,34.6 59,34.6 C58.1,34.6 57.4,33.9 57.4,33 C57.4,32.1 58.1,31.4 59,31.4 Z" fill="#FFF4D6"/>
  </g>
</svg>
